[project]
name = "agaura"
version = "0.1.0"
description = "Voting portal for in-person general assemblies"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "babel>=2.18.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=62",
]

[project.scripts]
agaura = "agaura.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8 naming
    "S",   # bandit (security)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is the point of tests
    "S105", # fake secrets in fixtures
    "S106",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: end-to-end tests in a real browser (Playwright, Chromium)"]
filterwarnings = [
    # Starlette suggests replacing httpx with httpx2 in its test client; httpx still works.
    # Revisit once httpx2 is vetted.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["agaura"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "playwright==1.55.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
