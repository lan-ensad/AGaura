# AGaura on the VPS: copy to /etc/fail2ban/jail.d/agaura.conf (see deploy/README.md).
#
# Docker publishes ports 80 and 443 through its own firewall rules, which come before the usual
# INPUT chain: a ban only works in the DOCKER-USER chain, which Docker consults first. Set per
# jail, never in [DEFAULT]: the sshd jail must keep banning in INPUT.
#
# Only robots probing for other software are banned. Requests the application refuses (429) are
# not: a whole room shares one address (venue Wi-Fi, mobile carriers' CGNAT), and banning it
# would stop the assembly; the application keeps its own finer limits (agaura/web/limits.py).
# A ban of a shared address can still be triggered on purpose from inside the room: on an
# assembly day, exempt the venue address (deploy/README.md §4).

[agaura-probes]
enabled = true
filter = agaura-probes
logpath = /srv/agaura/logs/caddy/access.log
backend = auto
banaction = iptables-allports[chain="DOCKER-USER"]
findtime = 10m
maxretry = 20
bantime = 1h
