# AGaura behind Caddy: robots probing for other software (/wp-login.php, /.env, /.git…). Only
# 404 answers on paths AGaura never serves count, so a person mistyping a session ID or an
# address is never banned. Reads the JSON access log written by deploy/Caddyfile
# ("log fail2ban"), whose times are in ISO 8601 (found by the default date detection).
# The request fields are matched in Caddy's order (remote_ip, remote_port, client_ip, proto,
# method, host, uri): request headers, logged after the URI, cannot forge a match.

[Definition]
failregex = ^\{.*"request":\{"remote_ip":"[^"]*","remote_port":"[^"]*","client_ip":"<ADDR>","proto":"[^"]*","method":"[^"]*","host":"[^"]*","uri":"[^"]*(?:\.php|\.aspx?|\.cgi|/wp-|/\.env|/\.git|/cgi-bin/|/phpmyadmin)[^"]*".*"status":404[,}]
ignoreregex =
