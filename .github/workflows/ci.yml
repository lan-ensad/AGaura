name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only test and build, they never write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core  # WeasyPrint (PDF)
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python scripts/i18n.py check
      - run: uv run playwright install --with-deps chromium  # browser for tests/web/e2e
      - run: uv run pytest --cov

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
